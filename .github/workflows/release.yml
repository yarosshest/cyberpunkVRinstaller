name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build installer
        shell: pwsh
        run: ./build.ps1

      - name: Self-test
        shell: pwsh
        run: dotnet ./bin/Release/net8.0-windows/win-x64/CyberpunkVRPortInstaller.dll --self-test

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberpunkVRPortInstaller-0.1.9
          path: dist/CyberpunkVRPortInstaller-0.1.9.exe
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/CyberpunkVRPortInstaller-0.1.9.exe

