name: Installer bug
description: Report an installation, removal, Safe Mode, or UI problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach save files or a complete `.dmp` unless requested.
  - type: input
    id: installer-version
    attributes:
      label: Installer version
      placeholder: 0.1.9 / FIX 2
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Cyberpunk 2077 version
      placeholder: 2.5, Steam/GOG/Epic
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - VR port installation
        - Component installation
        - Nexus archives
        - Safe Mode
        - Disable or removal
        - User interface
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: What did you select, and what happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and additional information
      description: Attach report.txt/stacktrace.txt or paste a short log excerpt.

